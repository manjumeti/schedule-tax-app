version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tax_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: tax_app
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax_app -d tax_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      APP_DEBUG: "false"
      APP_DATABASE_URL: postgresql+asyncpg://tax_app:${POSTGRES_PASSWORD:-changeme}@db:5432/tax_app
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set a strong secret key}
      APP_CSRF_SECRET: ${APP_CSRF_SECRET:?set a strong csrf secret}
      APP_CORS_ALLOW_ORIGINS: '["http://localhost:8080"]'
      APP_LOG_LEVEL: INFO
      APP_LOG_JSON: "true"
      APP_MARKET_DATA_PROVIDER: yfinance_sbi
      APP_SBI_PDF_DIR: /app/sbi-fx-ratekeeper/pdf_files
    volumes:
      - ../sbi-fx-ratekeeper/pdf_files:/app/sbi-fx-ratekeeper/pdf_files:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir src"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
